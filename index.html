<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="תמלולון – תמלול קבצי אודיו מקומי בדפדפן" />
    <title>תמלולון</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (!crossOriginIsolated && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('./coi-serviceworker.js').then(reg => {
          // Wait for the SW to become active before reloading, so the reload
          // is actually served through the SW (and gets COOP/COEP headers).
          const sw = reg.installing || reg.waiting || reg.active;
          if (reg.active && !reg.installing && !reg.waiting) {
            location.reload();
          } else if (sw) {
            sw.addEventListener('statechange', function() {
              if (sw.state === 'activated') location.reload();
            });
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
